name: Mantener Supabase activo

# Hace consultas a la base de datos dos veces al día para que Supabase
# (plan gratuito) no pause el proyecto por inactividad.
on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC
    - cron: "43 17 * * *"  # todos los días a las 17:43 UTC
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: https://ccxrxphkipuicixnwsuo.supabase.co
          SUPABASE_KEY: sb_publishable_tNd5_wo3cRKTWMnX9-AESg_1cGoEZk5
        run: |
          ok=0
          for tabla in clientes cargas pallets balances zpl_templates; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$tabla?select=*&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            echo "$tabla -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Supabase no responde. Puede que el proyecto ya esté pausado: entra en supabase.com y reactívalo."
            exit 1
          fi

      # GitHub desactiva las tareas programadas si el repositorio pasa 60 días
      # sin cambios. Para evitarlo, una vez al mes se guarda la fecha en un archivo.
      - name: Mantener vivo el repositorio (una vez al mes)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        uses: actions/checkout@v4
      - name: Guardar fecha
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        run: |
          mes=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" != "$mes" ]; then
            echo "$mes" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive $mes"
            git push
          else
            echo "Ya registrado este mes."
          fi
